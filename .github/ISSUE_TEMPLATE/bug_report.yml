name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest program or config that shows it.
      render: go
  - type: input
    id: versions
    attributes:
      label: Versions
      description: otelprofile, Go (`go version`), OS/arch
      placeholder: v0.1.0, go1.27.3, linux/amd64
    validations:
      required: true
  - type: input
    id: receiver
    attributes:
      label: Receiver
      description: Where the profiles go (collector, Pyroscope, ...), with version
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: otelprofile errors from your logger, receiver logs
      render: text
