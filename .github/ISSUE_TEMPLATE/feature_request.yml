name: Feature request
description: Something otelprofile should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What do you propose?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
